# Container logs capped at 3 x 10 MB per service, so a chatty container
# can't fill the disk (deploy/bootstrap_ubuntu24.sh sets the same default
# for the whole Docker daemon; this keeps it true on any other host).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-image: &app-image
  build: .
  # Shared by panel/manager/migrate: same code, same deps, same secrets. Only
  # `command` (and, for the panel, the published port) differs between them.
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  env_file:
    # Optional: DATABASE_URL / USERBOT_MASTER_KEY / ADMIN_PASSWORD etc. can
    # live here instead of your shell environment. Never baked into the
    # image, never committed — see the SECURITY-SENSITIVE env vars called out
    # below.
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-userbot}:${POSTGRES_PASSWORD:-changeme-in-prod}@postgres:5432/${POSTGRES_DB:-userbot}
    DATA_DIR: /app/data
    # SECURITY-SENSITIVE: base64 32-byte key that crypto.py uses to encrypt
    # session strings and other secrets at rest in Postgres. There is no
    # default — crypto.py refuses to boot without one. Generate one with
    # `python -c "import secrets, base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"`
    # and supply it via .env or your orchestrator's secret store, never by
    # editing this file.
    USERBOT_MASTER_KEY: ${USERBOT_MASTER_KEY:?USERBOT_MASTER_KEY must be set — see comment above}
  volumes:
    # Per-worker session files and other DATA_DIR scratch state survive
    # rebuilds. The database of record is Postgres, not this volume.
    - ./data:/app/data
  logging: *logging

services:
  # Shared state store for the whole fleet: every panel/manager/worker talks
  # to this one Postgres instead of each account having its own SQLite file.
  postgres:
    image: postgres:16
    container_name: userbot-postgres
    restart: unless-stopped
    environment:
      # SECURITY-SENSITIVE: these three defaults are fine for a laptop, not
      # for production. Override POSTGRES_PASSWORD (and ideally the user/db
      # names too) via .env or your orchestrator's secret store before
      # deploying anywhere reachable by anyone but you.
      POSTGRES_DB: ${POSTGRES_DB:-userbot}
      POSTGRES_USER: ${POSTGRES_USER:-userbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-in-prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Postgres accepts TCP connections before it has finished recovery/init
    # on a fresh volume, which is exactly when a naive `depends_on` (without
    # a condition) would let migrate/panel/manager race it and fail their
    # first connection. pg_isready blocks until it's actually ready to serve.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-userbot} -d ${POSTGRES_DB:-userbot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    # Not published to the host at all: nothing outside this compose network
    # needs to reach Postgres directly, and every port opened is one more
    # thing to secure. Use `docker compose exec postgres psql ...` to poke
    # at it manually.

  # Command bus + live-event fan-out between the panel (which holds no live
  # Telegram connections at all) and whichever manager worker actually holds
  # a given session's lease — see commands.py. Holds no data that outlives a
  # single command's round trip or a websocket's lifetime; Postgres remains
  # the only thing anything here is actually persisted to.
  # Valkey speaks the Redis protocol; the code uses only PUBLISH/SUBSCRIBE
  # through redis-py, so REDIS_URL keeps its name.
  valkey:
    image: valkey/valkey:8-alpine
    container_name: userbot-valkey
    restart: unless-stopped
    # Pub/sub only, nothing stored: no snapshots, no append-only file, so
    # it never writes to disk (and can't refuse commands over a failed
    # background save).
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    # Not published to the host, same reasoning as postgres above.

  # One-shot: applies pending migrations (pg.apply_migrations) and exits.
  # Per pg.py's own docstring, only this step (and the test harness) is
  # supposed to call apply_migrations — panel.py and manager.py both call
  # assert_version and refuse to boot on a schema mismatch instead of
  # migrating themselves, so a half-upgraded fleet can never run two schema
  # versions at once. Splitting this into its own service (rather than
  # having manager.py migrate on startup) means restarting/scaling the
  # manager never re-triggers a migration race, and the panel doesn't need
  # migration permissions at all.
  migrate:
    <<: *app-image
    container_name: userbot-migrate
    command: ["python", "migrate_entrypoint.py"]
    # Overrides the shared depends_on: migrate only needs Postgres to be up,
    # not itself (that would be circular) or a healthcheck (it has none —
    # it's not a long-running service).
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The unified admin panel: one process, one login, manages every Telegram
  # account in the fleet instead of one panel per account. Holds no live
  # Telegram connections itself — it reads/writes Postgres and this
  # session's local files directly, and reaches a session's actual live
  # client (held by whichever manager worker leased it) over the valkey
  # command bus. See panel.py's module docstring for why it's built this
  # way instead of running its own SessionRuntimes.
  panel:
    <<: *app-image
    container_name: userbot-panel
    command: ["python", "panel.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-userbot}:${POSTGRES_PASSWORD:-changeme-in-prod}@postgres:5432/${POSTGRES_DB:-userbot}
      REDIS_URL: redis://valkey:6379/0
      DATA_DIR: /app/data
      USERBOT_MASTER_KEY: ${USERBOT_MASTER_KEY:?USERBOT_MASTER_KEY must be set — see comment above}
      # SECURITY-SENSITIVE: no default on purpose. panel.py requires this
      # and there is no "safe" placeholder — set a real password via .env or
      # your orchestrator's secret store.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set — the panel refuses to boot without it}
    # Note the 127.0.0.1 prefix. Without it Docker publishes the panel on
    # every interface, and the panel is the one service in this file meant
    # for a human to reach. Get to it from your laptop with an SSH tunnel:
    #     ssh -N -L 8787:127.0.0.1:8787 you@your-server
    # then open http://127.0.0.1:8787 on the laptop as usual. For a public
    # HTTPS address instead (or as well), see the optional `caddy` service
    # below — it reaches the panel over the compose network, so this
    # loopback-only publish stays exactly as it is either way.
    ports:
      - "127.0.0.1:8787:8787"
    # "healthy" in `docker compose ps` once the panel answers HTTP. The
    # login-options route needs no login and touches nothing.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/login-options', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # The one background scheduler: once a minute it nudges every running
  # account to send due booking reminders, let unanswered requests lapse,
  # move waitlist offers on and release replies that quiet hours held back
  # (scheduler.py). Holds a Postgres advisory lock, so a second copy would
  # only wait. No Telegram connection of its own.
  scheduler:
    <<: *app-image
    container_name: userbot-scheduler
    command: ["python", "scheduler.py"]
    # `environment` here replaces the shared block above (a YAML merge is
    # shallow), so everything the app services share is repeated.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-userbot}:${POSTGRES_PASSWORD:-changeme-in-prod}@postgres:5432/${POSTGRES_DB:-userbot}
      REDIS_URL: redis://valkey:6379/0
      DATA_DIR: /app/data
      USERBOT_MASTER_KEY: ${USERBOT_MASTER_KEY:?USERBOT_MASTER_KEY must be set — see comment above}

  # OPTIONAL public pages for bookings: the calendar feed per client
  # (/cal/<token>.ics) and a read-only page per booking (/b/<token>).
  # Only started with the `booking-pages` profile (served by the `caddy`
  # service next to the public panel) or the `booking-only` profile (served
  # by `caddy-booking`, no public panel). It serves nothing else (not the
  # panel). Set BOOKING_DOMAIN and PUBLIC_BASE_URL in .env.
  booking-pages:
    <<: *app-image
    container_name: userbot-booking-pages
    # Both profiles: caddy-booking (booking-only) depends on this service,
    # and Compose does not enable a dependency's profile by itself.
    profiles: ["booking-pages", "booking-only"]
    command: ["python", "public_app.py"]
    # The one app service facing the internet directly gets none of .env
    # (admin password, authenticator key, master key, SMTP login): it needs
    # only the database, the bus and the settings below.
    env_file: []
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-userbot}:${POSTGRES_PASSWORD:-changeme-in-prod}@postgres:5432/${POSTGRES_DB:-userbot}
      REDIS_URL: redis://valkey:6379/0
      PUBLIC_BIND: 0.0.0.0
      PUBLIC_PORT: "8788"
      PUBLIC_HOST: ${BOOKING_DOMAIN:-localhost}

  # HTTPS for the booking pages, with its own Let's Encrypt certificate for
  # BOOKING_DOMAIN (Caddyfile.booking). It uses ports 80/443 like `caddy`
  # below, so never run the two together.
  caddy-booking:
    image: caddy:2-alpine
    container_name: userbot-caddy-booking
    # Only for booking pages WITHOUT the public panel
    # (COMPOSE_PROFILES=booking-only). With the panel public as well, the
    # `caddy` service serves both: set BOOKING_DOMAIN and
    # COMPOSE_PROFILES=public,booking-pages.
    profiles: ["booking-only"]
    restart: unless-stopped
    depends_on:
      - booking-pages
    environment:
      BOOKING_DOMAIN: ${BOOKING_DOMAIN:-}
    command:
      - sh
      - -c
      - >-
        if [ -z "$$BOOKING_DOMAIN" ]; then
        echo "BOOKING_DOMAIN must be set (in .env) for the booking-pages profile — see README" >&2;
        exit 1; fi;
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.booking:/etc/caddy/Caddyfile:ro
      - caddy_booking_data:/data
      - caddy_booking_config:/config
    logging: *logging

  # OPTIONAL public HTTPS front door for the panel. Only started with
  #     docker compose --profile public up -d
  # — a plain `docker compose up -d` ignores it and the panel stays
  # SSH-tunnel-only. Caddy gets a Let's Encrypt certificate for PANEL_DOMAIN
  # on its own (which is why it needs ports 80 and 443 open to the internet)
  # and reverse-proxies to the panel; see ./Caddyfile. With PANEL_DOMAIN set
  # the panel refuses to start without ADMIN_TOTP_SECRET and an
  # ADMIN_PASSWORD of 14+ characters (panel.py check_public_setup); logins
  # are rate-limited per client IP.
  caddy:
    image: caddy:2-alpine
    container_name: userbot-caddy
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      - panel
    environment:
      # A real domain whose A record points at this server, or a free
      # sslip.io name derived from the server's IP (e.g.
      # 203-0-113-7.sslip.io). `:-` rather than `:?` on purpose: Compose
      # interpolates the whole file even for services whose profile isn't
      # enabled, so `:?` here would break plain `docker compose up` for
      # everyone not using this profile. The `command` below does the
      # "must be set" check instead, only when Caddy actually starts.
      PANEL_DOMAIN: ${PANEL_DOMAIN:-}
      BOOKING_DOMAIN: ${BOOKING_DOMAIN:-}
    # Same as the image's default command, behind a guard: with
    # PANEL_DOMAIN empty the Caddyfile's site address would silently
    # collapse into its global-options block and fail with a confusing
    # parse error. `$$` is Compose's escape for a literal `$`.
    command:
      - sh
      - -c
      - >-
        if [ -z "$$PANEL_DOMAIN" ]; then
        echo "PANEL_DOMAIN must be set (in .env) for the public profile — see README" >&2;
        exit 1; fi;
        CONF=/etc/caddy/Caddyfile;
        if [ -n "$$BOOKING_DOMAIN" ]; then CONF=/etc/caddy/Caddyfile.both; fi;
        exec caddy run --config "$$CONF" --adapter caddyfile
    ports:
      - "80:80"      # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      # All three in one folder: Caddyfile.both imports the other two by
      # paths relative to itself.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.booking:/etc/caddy/Caddyfile.booking:ro
      - ./Caddyfile.both:/etc/caddy/Caddyfile.both:ro
      # Certificates and ACME account keys. Keep this volume: losing it
      # means re-issuing certificates, and Let's Encrypt rate-limits that.
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  # The fleet manager: leases sessions from Postgres and runs a
  # SessionRuntime worker per leased session, WORKER_COUNT/SESSIONS_PER_WORKER
  # at a time. Kept as its own service (not folded into the panel process)
  # because it has a completely different failure/scaling story — it holds
  # live Telegram connections and you may eventually want more than one
  # replica of it, while the panel is a single admin UI that should stay a
  # singleton.
  manager:
    <<: *app-image
    container_name: userbot-manager
    command: ["python", "manager.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-userbot}:${POSTGRES_PASSWORD:-changeme-in-prod}@postgres:5432/${POSTGRES_DB:-userbot}
      REDIS_URL: redis://valkey:6379/0
      DATA_DIR: /app/data
      USERBOT_MASTER_KEY: ${USERBOT_MASTER_KEY:?USERBOT_MASTER_KEY must be set — see comment above}
      # How many SessionRuntime workers this manager replica runs, and how
      # many leased sessions each worker handles. Defaults match the fleet
      # plan's decided ratio (2 workers x 25 sessions); tune to the box's
      # CPU/RAM if that changes.
      WORKER_COUNT: ${WORKER_COUNT:-2}
      SESSIONS_PER_WORKER: ${SESSIONS_PER_WORKER:-25}

  # The WhatsApp transport (wa_gateway/, Node + Baileys): holds the WhatsApp
  # sockets the same way a manager worker holds Telethon clients, but takes
  # its orders from Python over the valkey command bus (cmd:@wa-gateway)
  # and keeps the Baileys auth state encrypted in Postgres (wa_auth_state).
  # Transport only: no pacing, drafting or approval happens here. A
  # singleton (Postgres advisory lock): a second copy exits and is restarted.
  # See wa_gateway/README.md for the wire format.
  wa-gateway:
    build: ./wa_gateway
    container_name: userbot-wa-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-userbot}:${POSTGRES_PASSWORD:-changeme-in-prod}@postgres:5432/${POSTGRES_DB:-userbot}
      REDIS_URL: redis://valkey:6379/0
      USERBOT_MASTER_KEY: ${USERBOT_MASTER_KEY:?USERBOT_MASTER_KEY must be set — see comment above}
      WA_GATEWAY_LOG_LEVEL: ${WA_GATEWAY_LOG_LEVEL:-info}
    # No ports: it only dials out (Postgres, Valkey, WhatsApp).
    # "healthy" once the gateway is subscribed to its command channel on
    # Valkey (cmd:@wa-gateway; it is that channel's only subscriber), which
    # it only is after the master key, the singleton lock and the bus are
    # all in hand. The gateway has no HTTP, so this asks Valkey instead, with
    # the ioredis the image already ships. A gateway that never got that far
    # or lost its Valkey subscription shows "unhealthy" in `docker compose
    # ps` within ~1.5 minutes (a blocked event loop keeps its subscription,
    # so that one is for the logs and the manager's command timeouts).
    healthcheck:
      test: ["CMD", "node", "-e", "const R=require('ioredis');const c=new R(process.env.REDIS_URL,{lazyConnect:true,connectTimeout:4000,maxRetriesPerRequest:0,enableReadyCheck:false,enableOfflineQueue:false});c.connect().then(()=>c.pubsub('NUMSUB','cmd:@wa-gateway')).then(r=>process.exit(Number(r[1])>0?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

volumes:
  # Postgres's data directory. Named (not bind-mounted) so its ownership/
  # permissions are managed by Docker instead of the host filesystem.
  pgdata:
  # Caddy's certificates/ACME state and its autosaved config (public
  # profile only; unused otherwise).
  caddy_data:
  caddy_config:
  caddy_booking_data:
  caddy_booking_config:
