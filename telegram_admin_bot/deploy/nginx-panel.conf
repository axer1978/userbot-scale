# nginx on the host in front of the admin panel — the alternative to the
# optional `caddy` compose service (use one or the other: both want ports
# 80/443). The panel is already published on the host at 127.0.0.1:8787.
#
# Install (Ubuntu), replacing panel.example.com everywhere below with your
# PANEL hostname (a domain's A record, or <ip-with-dashes>.sslip.io):
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx-panel.conf /etc/nginx/sites-available/userbot-panel
#   sudo sed -i 's/panel.example.com/YOUR-HOSTNAME/' /etc/nginx/sites-available/userbot-panel
#   sudo ln -s /etc/nginx/sites-available/userbot-panel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR-HOSTNAME --redirect
# certbot adds the TLS server block and the http->https redirect to this file
# and renews the certificate on its own (systemd timer).

# Websocket upgrade for /ws/*. Named after this site so it can't collide
# with a $connection_upgrade map another site on the host already defines.
map $http_upgrade $userbot_panel_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    # Media library uploads go through the panel; nginx's default is 1 MB.
    client_max_body_size 100m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # OVERWRITE, never append ($proxy_add_x_forwarded_for): the panel runs
        # uvicorn with forwarded_allow_ips="*", which takes the FIRST address
        # in this header as the client. Appending would let a visitor put any
        # address first and walk around the per-IP login rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $userbot_panel_connection;
        # Keep the live-updates websocket open between messages.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
