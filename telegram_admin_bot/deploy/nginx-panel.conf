# nginx on the host in front of the admin panel — the alternative to the
# optional `caddy` compose service (use one or the other: both want ports
# 80/443). The panel is already published on the host at 127.0.0.1:8787.
#
# Install (Ubuntu), replacing panel.example.com everywhere below with your
# PANEL hostname (a domain's A record, or <ip-with-dashes>.sslip.io):
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx-panel.conf /etc/nginx/sites-available/userbot-panel
#   sudo sed -i 's/panel.example.com/YOUR-HOSTNAME/' /etc/nginx/sites-available/userbot-panel
#   sudo ln -s /etc/nginx/sites-available/userbot-panel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR-HOSTNAME --redirect
# certbot adds the TLS settings and the http->https redirect to this file
# and renews the certificate on its own (systemd timer). See also
# nginx-default-deny.conf and fail2ban/ next to this file.

# Websocket upgrade for /ws/*. Named after this site so it can't collide
# with a $connection_upgrade map another site on the host already defines.
map $http_upgrade $userbot_panel_connection {
    default upgrade;
    ''      close;
}

# Rate limits, per client IP, enforced here before a request reaches the
# panel. Login: 10 a minute with a burst of 5 — far above a human retyping
# a password, far below a guessing script. Everything else: generous, the
# UI fires several requests per click. The panel keeps its own lockout
# (5 wrong passwords / 15 min) behind this.
limit_req_zone $binary_remote_addr zone=userbot_panel_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=userbot_panel_all:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=userbot_panel_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    # Own log so fail2ban (fail2ban/userbot-panel.conf) reads only this site.
    access_log /var/log/nginx/userbot-panel.access.log;

    # Media library uploads go through the panel; nginx's default is 1 MB.
    client_max_body_size 100m;
    # Don't let a client hold a connection open by sending slowly.
    client_header_timeout 10s;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    limit_conn userbot_panel_conn 30;
    limit_req_status 429;
    limit_conn_status 429;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The page's own inline script/style stay allowed; this forbids framing,
    # plugins, <base> hijacking and posting forms anywhere else.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;

    # Inherited by both locations below (neither sets its own).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # OVERWRITE, never append ($proxy_add_x_forwarded_for): the panel runs
    # uvicorn with forwarded_allow_ips="*", which takes the FIRST address
    # in this header as the client. Appending would let a visitor put any
    # address first and walk around the per-IP login rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $userbot_panel_connection;
    # Keep the live-updates websocket open between messages.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location = /api/login {
        limit_req zone=userbot_panel_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location / {
        limit_req zone=userbot_panel_all burst=100 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }
}
