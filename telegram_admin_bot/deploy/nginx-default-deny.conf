# Catch-all for requests that don't name the panel's hostname — mostly
# scanners sweeping IP addresses. They get the connection closed with no
# response (444) instead of a page that confirms something runs here.
#
# Replaces Ubuntu's stock "default" site, which also claims default_server:
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo cp deploy/nginx-default-deny.conf /etc/nginx/sites-available/default-deny
#   sudo ln -s /etc/nginx/sites-available/default-deny /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

# HTTPS sweeps by IP: refuse the TLS handshake for unknown names instead of
# presenting the panel's certificate. Needs nginx 1.19.4+ (`nginx -v`;
# Ubuntu 24.04 ships 1.24, 22.04 ships 1.18). Uncomment if yours is new
# enough — on older nginx this block makes `nginx -t` fail.
#
# server {
#     listen 443 ssl default_server;
#     listen [::]:443 ssl default_server;
#     server_name _;
#     ssl_reject_handshake on;
# }
