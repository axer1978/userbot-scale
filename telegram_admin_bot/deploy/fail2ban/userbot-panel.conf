# fail2ban filter: failed or rate-limited admin logins in the panel's nginx
# access log (combined format). Install:
#   sudo cp deploy/fail2ban/userbot-panel.conf /etc/fail2ban/filter.d/
#   sudo cp deploy/fail2ban/userbot-panel.local /etc/fail2ban/jail.d/
#   sudo systemctl restart fail2ban
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "POST /api/login(?:\?[^ "]*)? HTTP/[0-9.]+" (?:401|429) 
ignoreregex =
